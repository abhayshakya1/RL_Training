[project]
name = "geo-distance"
version = "0.1.0"
description = "Great-circle distance between two points on a sphere, from coordinates."
tags = ["geometry", "math", "train", "eval"]
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geo_distance"]
